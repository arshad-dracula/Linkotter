# The NAS's own always-on Linkotter node: peer relay, office LAN gateway, file-drop target.
# Shared by control/ and relay/ compose files.
services:
  node:
    image: docker.io/tailscale/tailscale:v1.104.7
    container_name: linkotter-node
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TS_AUTHKEY: ${NODE_AUTHKEY:-}
      TS_HOSTNAME: ${NODE_HOSTNAME:?set NODE_HOSTNAME in deploy/.env}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_ACCEPT_DNS: "false"
      # Never send engine logs to the upstream vendor.
      TS_NO_LOGS_NO_SUPPORT: "true"
      TS_ROUTES: ${LAN_ROUTES:-}
      TS_EXTRA_ARGS: --login-server=https://${CONTROL_HOSTNAME}
      # Fixed UDP port so the router can forward it (direct connections).
      TS_TAILSCALED_EXTRA_ARGS: --port=41641
    volumes:
      - node-state:/var/lib/tailscale
