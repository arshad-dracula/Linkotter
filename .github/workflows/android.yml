name: Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      control_url:
        description: "Default server built into the app, e.g. https://link.example.com (blank = entered in the app)"
        required: false

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CONTROL_URL: ${{ inputs.control_url || vars.LINKOTTER_CONTROL_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch upstream Android client at the pinned commit
        run: |
          . android/UPSTREAM
          git init -q upstream
          git -C upstream fetch -q --depth 1 "$repo" "$commit"
          git -C upstream checkout -q FETCH_HEAD

      - uses: actions/setup-go@v5
        with:
          go-version-file: upstream/go.mod
          cache-dependency-path: upstream/go.sum

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Keeps the test-signing key stable between builds so a new APK installs over the old one.
      # Best effort only: a proper release key must come from a repository secret before wider rollout.
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: linkotter-test-signing-key-v1

      - name: Rebrand
        run: python3 android/rebrand.py upstream "$CONTROL_URL"

      - name: Build
        working-directory: upstream
        run: make tailscale-debug.apk

      - name: Collect
        run: |
          mkdir out
          cp upstream/tailscale-debug.apk "out/linkotter-android-${GITHUB_SHA::7}.apk"
          "$ANDROID_HOME"/build-tools/*/aapt2 dump badging out/*.apk | head -3 || true

      - uses: actions/upload-artifact@v4
        with:
          name: linkotter-android
          path: out/*.apk

  # Installs the APK on an emulator and checks it starts and stays up.
  smoke:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linkotter-android
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r apk/*.apk
            adb shell pm list packages | grep -x "package:ai.propvr.linkotter"
            adb shell dumpsys package ai.propvr.linkotter | grep -E "versionName|firstInstallTime" | head -2
            adb logcat -c
            adb shell am start -W -n ai.propvr.linkotter/com.tailscale.ipn.MainActivity
            sleep 25
            adb exec-out screencap -p > apk/launch.png
            adb logcat -d > apk/logcat.txt
            adb shell pidof ai.propvr.linkotter
            adb shell dumpsys activity activities | grep -E "ResumedActivity" || true
            if grep -E "FATAL EXCEPTION|Fatal signal" -A12 apk/logcat.txt | grep -E "linkotter|tailscale"; then echo "app crashed"; exit 1; fi
            # Emulators on CI sometimes put a system dialog ("not responding", permissions) in front.
            # That is reported, not failed; a crash of our process is what fails the job.
            if ! adb shell dumpsys activity activities | grep -E "ResumedActivity" | grep -q ai.propvr.linkotter; then
              echo "::warning::Linkotter is running but another window is in front"
              grep -E " ANR |not responding|AndroidRuntime|permissioncontroller" apk/logcat.txt | tail -20 || true
            fi
            adb shell uiautomator dump /sdcard/ui.xml && adb pull /sdcard/ui.xml apk/ui.xml
            echo "--- text on screen:"; grep -o 'text="[^"]\+"' apk/ui.xml | sort -u | head -40
            if grep -o 'text="[^"]*"' apk/ui.xml | grep -q "Tailscale"; then echo "note: upstream name still visible on the first screen"; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke
          path: |
            apk/launch.png
            apk/logcat.txt
            apk/ui.xml
